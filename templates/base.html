{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Municipalidad de La Serena</title>
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
</head>
<!-- min-vh-100 hace que el body ocupe siempre el 100% de la altura de la pantalla -->
<body class="bg-light d-flex flex-column min-vh-100">
    
    <header class="bg-danger p-3 shadow-sm">
        <div class="container">
            <a href="/" class="text-white text-decoration-none">
                
                <h1 class="h3 mb-0">Ilustre Municipalidad de La Serena</h1>
            </a>
        </div>
    </header>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <div class="navbar-nav">
                <!-- Enlaces corregidos apuntando a las rutas reales -->
                <a class="nav-link" href="/">Inicio</a>
                <a class="nav-link" href="/delegaciones/">Delegaciones Territoriales</a>
            </div>
        </div>
    </nav>
    
    <!-- flex-grow-1 empuja automáticamente el footer hacia el fondo -->
    <main class="container flex-grow-1">
        {% block contenido %}
        {% endblock %}
    </main>

    <!-- mt-auto asegura que la barra negra se ancle abajo -->
    <footer class="bg-dark text-white text-center p-3 mt-auto">
        <p class="mb-0">Atendiendo las necesidades de la comunidad local.</p>
    </footer>
    
    <script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
</body>
</html>
