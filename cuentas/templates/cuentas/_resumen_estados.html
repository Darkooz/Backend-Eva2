<div class="row g-3 mb-4">
    {% for e in resumen_estados %}
    <div class="col-6 col-lg-3">
        <a href="{% url 'solicitudes:solicitud_list' %}?estado={{ e.codigo }}" class="text-decoration-none">
            <div class="card text-bg-{{ e.color }} shadow-sm text-center h-100">
                <div class="card-body py-3"><div class="display-6 fw-bold">{{ e.total }}</div><div>{{ e.etiqueta }}</div></div>
            </div>
        </a>
    </div>
    {% endfor %}
</div>
