{% extends 'base.html' %}
{% block titulo %}Ingresar | Municipalidad de La Serena{% endblock %}
{% block contenido %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-4">
        <div class="card shadow-sm border-danger">
            <div class="card-header bg-danger text-white"><h2 class="h5 mb-0">Ingreso al sistema</h2></div>
            <div class="card-body">
                <form method="post" novalidate>
                    {% csrf_token %}
                    <input type="hidden" name="next" value="{{ next }}">
                    {% include 'includes/formulario_campos.html' %}
                    <button type="submit" class="btn btn-danger w-100">Ingresar</button>
                </form>
                <div class="text-center mt-3">
                    <a href="{% url 'cuentas:password_reset' %}">¿Olvidó su contraseña?</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
