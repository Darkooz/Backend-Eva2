{% extends 'base.html' %}
{% block titulo %}{{ titulo }} | Municipalidad de La Serena{% endblock %}
{% block contenido %}
<div class="row justify-content-center">
    <div class="col-lg-7">
        <div class="card shadow-sm">
            <div class="card-header bg-dark text-white"><h2 class="h5 mb-0">{{ titulo }}</h2></div>
            <div class="card-body">
                {% if subtitulo %}<p class="text-muted">{{ subtitulo }}</p>{% endif %}
                <form method="post" novalidate>
                    {% csrf_token %}
                    {% include 'includes/formulario_campos.html' %}
                    <div class="d-flex gap-2 justify-content-end mt-4">
                        <a href="{{ volver_url }}" class="btn btn-outline-secondary">Cancelar</a>
                        <button type="submit" class="btn btn-danger">{{ texto_boton|default:'Guardar' }}</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
